name: Template validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-template:
    name: Validate template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate template documentation
        run: python3 scripts/validate_template.py

      - name: Check whitespace
        run: git show --format= --check HEAD
